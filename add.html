<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add a Friend on FlightMark</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0a1a38;color:#fff;font:17px -apple-system,system-ui,sans-serif;text-align:center}
main{padding:24px;max-width:420px}
a{display:block;margin:14px 0;padding:14px;border-radius:12px;background:#1a44e0;color:#fff;font-weight:600;text-decoration:none}
a.second{background:none;border:1px solid #6d86b8}
p{color:#c8d4ea}
</style>
</head>
<body>
<main>
<h1>Add a friend on FlightMark</h1>
<p id="note">Open this invite in the app.</p>
<a id="open" href="flightmark://add">Open in FlightMark</a>
<a class="second" href="https://apps.apple.com/app/id6827772017">Get FlightMark on the App Store</a>
</main>
<script>
var code = (new URLSearchParams(location.search).get('code') || '').replace(/[^A-Za-z0-9]/g, '').slice(0, 6);
if (code) {
  document.getElementById('open').href = 'flightmark://add?code=' + encodeURIComponent(code);
} else {
  document.getElementById('note').textContent = 'This invite link is missing its code. Ask your friend to send it again.';
  document.getElementById('open').style.display = 'none';
}
</script>
</body>
</html>
